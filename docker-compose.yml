services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hiddennoir
      POSTGRES_USER: hiddennoir
      POSTGRES_PASSWORD: hiddennoir
    ports: ["5432:5432"]
    volumes: [hiddennoir_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiddennoir -d hiddennoir"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [hiddennoir_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hiddennoir_postgres:
  hiddennoir_redis:
